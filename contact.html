<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visavera – Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: "Outfit", sans-serif; overflow-x: hidden; }

.hero {
  min-height: 100vh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: 80px 24px 48px;
  background: radial-gradient(ellipse 70% 55% at 50% 42%, rgba(200,16,46,0.07) 0%, transparent 70%), var(--bg);
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
  font-weight: 600; color: var(--red);
  border: 1px solid rgba(200,16,46,0.25); background: var(--red-light);
  padding: 6px 18px; border-radius: 20px; margin-bottom: 28px;
  opacity: 0; animation: fadeUp .6s .1s forwards;
}
.hero-badge::before { content: "✦"; font-size: 10px; }
.hero h1 {
  font-family: "Playfair Display", serif;
  font-size: clamp(40px, 6vw, 80px); font-weight: 900;
  line-height: 1.06; max-width: 780px; color: var(--black);
  opacity: 0; animation: fadeUp .7s .2s forwards;
}
.hero h1 em { font-style: italic; color: var(--red); }
.hero p {
  color: var(--text-2); font-size: 17px; margin-top: 20px;
  max-width: 480px; line-height: 1.65;
  opacity: 0; animation: fadeUp .7s .35s forwards;
}
.hero-btns {
  display: flex; gap: 12px; margin-top: 36px;
  justify-content: center; flex-wrap: wrap;
  opacity: 0; animation: fadeUp .7s .5s forwards;
}
.btn-primary {
  background: var(--red); color: #fff; border: none;
  padding: 13px 30px; border-radius: 10px;
  font-size: 14.5px; font-weight: 600; cursor: pointer;
  transition: background .25s, transform .25s, box-shadow .25s;
  font-family: "Outfit", sans-serif;
  box-shadow: 0 4px 18px var(--red-glow);
  text-decoration: none; display: inline-flex;
  align-items: center; justify-content: center;
  min-height: 44px; min-width: 44px;
}
.btn-primary:hover {
  background: var(--red-dark); transform: translateY(-2px);
  box-shadow: 0 8px 28px var(--red-glow);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-badge">Get In Touch</div>
  <h1>Let's Plan Your<br><em>Next Journey</em></h1>
  <p>Have questions about visas or travel? Our team is ready to help you every step of the way.</p>
  <div class="hero-btns">
    <a href="mailto:hello@visavera.com" class="btn-primary">Email Us</a>
  </div>
</section>

<script src="nav.js"></script>
</body>
</html>
