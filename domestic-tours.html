<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Visavera – Domestic Tours</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="nav.css">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  min-height:100vh; min-height:100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: "Outfit", sans-serif;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ═══════════════════════════════════════════════
   PAGE HERO — centred title only
═══════════════════════════════════════════════ */
.page-hero {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  text-align: center;
  padding: calc(var(--nav-h) + 40px) 24px 40px;
  position: relative;
  overflow: hidden;
}
.page-hero::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  width: 600px; height: 600px;
  background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
  opacity: 0.35;
  transform: translate(-50%,-50%);
  pointer-events: none;
}
.page-title {
  position: relative;
  font-family: "Playfair Display", serif;
  font-weight: 900;
  font-size: clamp(40px, 8vw, 96px);
  line-height: 1.05;
  letter-spacing: -0.02em;
  color: var(--text);
  opacity: 0;
  transform: translateY(18px);
  animation: titleIn 0.8s 0.15s cubic-bezier(0.16,1,0.3,1) both;
}
.page-title .red { color: var(--red); }
@keyframes titleIn {
  from { opacity:0; transform: translateY(18px); }
  to   { opacity:1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .page-title { animation-duration: 0.01ms !important; }
}
</style>
</head>
<body>

<section class="page-hero">
  <h1 class="page-title">Domestic <span class="red">Tours</span></h1>
</section>

<script src="nav.js"></script>
</body>
</html>
